<style>
  /* Deslocamento para ocultar a barra de aviso do Google Apps Script */

  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f8fafc; }
  #moldura {
    position: fixed;
    top: calc(-1 * var(--barra-google));
    left: 0;
    width: 100%;
    height: calc(100% + var(--barra-google));
    border: 0;
  }
</style>
</head>
<body>
  <iframe
    id="moldura"
    src="https://script.google.com/macros/s/AKfycbyYsdqYmNxuHQMTrVcndb6maRRZ36OL5ePRGS0-FQFy6pE7GLm__uFLDNuj0rSXi5lNLQ/exec"
